<title>One More · prototype rétention</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700;800&display=swap">
<style>
/* Layout : panneau de pilotage à gauche, téléphone 390×844 mis à l'échelle à droite ; l'app garde son thème clair réel */
@font-face{font-family:"One More";src:url(data:font/woff2;base64,__FONT__) format("woff2");font-display:block}
@font-face{font-family:"One More Figures";src:url(data:font/woff2;base64,__FONT__) format("woff2");font-display:block;unicode-range:U+0030-0039}
.app{--f-ui:"One More Figures","Hanken Grotesk",system-ui,sans-serif}
.app input,.app textarea{font-family:"Hanken Grotesk",system-ui,sans-serif}
:root{
  --bg:#ECEDE6; --panel:#FAFAF6; --ink:#1B1C18; --soft:#5F625A; --line:#D9DBD1; --pick:#1B1C18; --pick-ink:#F7F8F2; --lime:#DFFF5E;
  --f-ui:"Hanken Grotesk",system-ui,sans-serif; --f-brand:"One More","Hanken Grotesk",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#141512;--panel:#1D1E1A;--ink:#ECEEE6;--soft:#A3A69C;--line:#33352E;--pick:#ECEEE6;--pick-ink:#141512;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141512;--panel:#1D1E1A;--ink:#ECEEE6;--soft:#A3A69C;--line:#33352E;--pick:#ECEEE6;--pick-ink:#141512;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);padding-inline:16px}
.wrap{display:flex;gap:24px;align-items:flex-start;justify-content:center;padding-block:20px;max-width:1180px;margin:0 auto}
.side{width:340px;flex:none;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 40px);overflow:auto;padding-right:4px}
.brand{font-family:var(--f-brand);font-style:italic;text-transform:uppercase;font-size:20px;line-height:1;margin:0}
.brand small{display:block;font-family:var(--f-ui);font-style:normal;text-transform:none;font-size:13px;color:var(--soft);margin-top:6px;line-height:1.4}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.box h2{margin:0;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:700}
.ctl{display:flex;flex-direction:column;gap:6px}
.ctl>span{font-size:13px;font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--bg);border-radius:9px;padding:3px}
.seg button{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:500 12.5px var(--f-ui);padding:7px 6px;border-radius:7px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--pick);color:var(--pick-ink);font-weight:700}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.scen{display:flex;flex-direction:column;gap:6px}
.scen button{text-align:left;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;padding:9px 10px;font:500 13px var(--f-ui);cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.scen button:hover{border-color:var(--ink)}
.scen em{font-style:normal;color:var(--soft);font-size:12px}
.map{display:flex;flex-direction:column;gap:12px}
.map h3{margin:0;font-size:12.5px;font-weight:700}
.map ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.map li button{width:100%;display:flex;align-items:center;gap:8px;border:0;background:transparent;color:var(--ink);font:400 13px var(--f-ui);padding:6px 8px;border-radius:7px;cursor:pointer;text-align:left}
.map li button:hover{background:var(--bg)}
.map li button[aria-current="true"]{background:var(--bg);font-weight:700}
.tag{font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:99px;flex:none}
.t-new{background:var(--lime);color:#000}
.t-rev{border:1px solid var(--ink);color:var(--ink)}
.t-old{background:var(--line);color:var(--soft)}
.legend{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--soft);align-items:center}
.reset{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:9px;padding:9px;font:600 13px var(--f-ui);cursor:pointer}
.stagewrap{flex:none;display:flex;flex-direction:column;align-items:center;gap:10px}
.now{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;min-height:22px}
.stage{position:relative}
.phone{width:390px;height:844px;border-radius:44px;background:#0d0d0d;padding:10px;box-sizing:content-box;transform-origin:top left;box-shadow:0 20px 50px rgba(0,0,0,.18)}
.screen{position:relative;width:390px;height:844px;border-radius:34px;overflow:hidden}
:focus-visible{outline:2px solid #3b82f6;outline-offset:2px}
@media (max-width:820px){.wrap{flex-direction:column-reverse;align-items:center}.side{width:100%;max-height:none}}

/* ---------- App One More (thème clair de l'app, tiré du code) ---------- */
.app{--a-bg:#F0F0F0;--a-card:#fff;--a-fg:#1f1f1f;--a-mut:#757575;--a-line:#e3e3e3;--a-sec:#F7F7F7;--a-acc:#DFFF5E;--a-pri:#1a1a1a;--a-or:#F97316;--a-red:#E0102B;
  position:absolute;inset:0;background:var(--a-bg);color:var(--a-fg);font-family:var(--f-ui);font-size:14px;display:flex;flex-direction:column;color-scheme:light}
.app *{box-sizing:border-box}
:where(.app button){font-family:inherit;color:inherit;cursor:pointer}
.app .scroll{flex:1;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.app .scroll::-webkit-scrollbar{display:none}
.app .pad{padding:16px;display:flex;flex-direction:column;gap:16px}
.om{font-family:var(--f-brand);font-style:italic;font-weight:700}
.ct{font-family:var(--f-brand);font-size:12px;text-transform:uppercase;font-style:italic;line-height:1.1;margin:0;font-weight:400}
.mut{color:var(--a-mut)}
.card{background:var(--a-card);border-radius:14px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{height:40px;border:0;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:8px;font-family:var(--f-brand);text-transform:uppercase;letter-spacing:.025em;font-size:12px;width:100%;text-decoration:none}
.b-dark{background:var(--a-pri);color:#fff}
.b-black{background:#000;color:var(--a-acc)}
.b-lime{background:var(--a-acc);color:#000}
.b-sec{background:var(--a-sec);color:var(--a-fg);font-family:var(--f-ui);text-transform:none;letter-spacing:0;font-size:14px;font-weight:500}
.b-out{background:var(--a-bg);border:1px solid var(--a-line);font-family:var(--f-ui);text-transform:none;letter-spacing:0;font-size:14px;font-weight:500}
.b-ghost{background:transparent;font-family:var(--f-ui);text-transform:none;letter-spacing:0;font-size:14px;font-weight:500;color:var(--a-mut)}
.b-glass{background:rgba(0,0,0,.08);color:#000;font-family:var(--f-ui);text-transform:none;letter-spacing:0;font-size:14px;font-weight:500;height:36px}
.chip{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;background:var(--a-sec);font-size:12px;font-weight:500;white-space:nowrap}
.rank{width:fit-content;display:inline-flex;align-items:center;gap:3px;height:20px;padding:0 8px;border-radius:99px;border:1px solid var(--a-line);background:#fff;font-family:var(--f-brand);font-weight:700;font-size:10px;text-transform:uppercase;white-space:nowrap}
.rank i{font-style:italic}
.bh{flex:none;background:#fff;border-bottom:1px solid var(--a-line);padding:12px 16px;display:flex;align-items:center;gap:14px}
.bh .back{width:36px;height:36px;border-radius:10px;background:var(--a-sec);border:0;display:flex;align-items:center;justify-content:center}
.bh h1{margin:0;font-family:var(--f-brand);font-size:16px;text-transform:uppercase;font-style:italic;font-weight:400}
.bh p{margin:0;font-size:12px;color:var(--a-mut)}
.nav{flex:none;height:72px;background:#fff;border-top:1px solid var(--a-line);display:flex;align-items:center;padding:0 16px 8px}
.nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--a-mut);font-size:10px;font-weight:500}
.nav .nvi{width:48px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.nav button[aria-current="page"]{color:#000;font-weight:600}
.nav button[aria-current="page"] .nvi{background:var(--a-acc)}
.pdot{position:relative;width:8px;height:8px;border-radius:9px;background:#000;flex:none;display:inline-block}.pdot::after{content:'';position:absolute;inset:0;border-radius:9px;background:inherit;animation:pdot 1.6s ease-out infinite}.pdot.lm{background:#DFFF5E}
@keyframes pdot{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.8);opacity:0}}
@media (prefers-reduced-motion:reduce){.pdot::after{animation:none}}
.lime{position:relative;background:var(--a-acc);color:#000;padding:16px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.lime>*{position:relative}
.lime .skew{position:absolute;right:-30px;top:0;bottom:0;width:120px;background:#000;opacity:.06;clip-path:polygon(45% 0,100% 0,100% 100%,0 100%)}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.figs b{display:block;font-family:var(--f-brand);font-style:italic;font-size:30px;line-height:1}
.figs span{font-size:12px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.exo{display:flex;align-items:center;gap:16px;padding:12px 0}
.exo+.exo{border-top:1px solid var(--a-line)}
.thumb{width:56px;height:56px;border-radius:8px;background:var(--a-sec);flex:none;display:flex;align-items:center;justify-content:center;color:#c9c9c9}
.plus{width:44px;height:44px;border-radius:99px;border:0;background:var(--a-pri);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;margin-top:12px;padding-top:12px;border-top:1px solid var(--a-line)}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px}
.wd small{font-size:9.6px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:var(--a-mut)}
.wd small.today{color:#1a1a1a;font-weight:700}
.c28{width:28px;height:28px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:10.4px;font-weight:600}
.bar{height:8px;border-radius:99px;background:var(--a-sec);overflow:hidden}
.bar>div{height:100%;border-radius:99px;background:var(--a-pri)}
.xp{padding:2px 6px;border-radius:99px;font-size:10px;font-weight:800;border:1px solid var(--a-or);background:rgba(249,115,22,.1);color:var(--a-or)}
.xp.dash{border-style:dashed;background:transparent}
.drawer-wrap{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;z-index:20}
.drawer{width:100%;background:var(--a-bg);border-radius:16px 16px 0 0;padding:10px 16px 28px;max-height:86%;overflow:auto;display:flex;flex-direction:column;gap:14px}
.grab{width:56px;height:6px;border-radius:99px;background:rgba(31,31,31,.3);margin:0 auto}
.dt{font-family:var(--f-brand);text-transform:uppercase;font-style:italic;font-size:14px;text-align:center;margin:0}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:40px;height:40px;border-radius:99px;border:1px solid var(--a-line);background:#fff;display:flex;align-items:center;justify-content:center}
.stepper output{flex:1;height:56px;border-radius:14px;background:var(--a-sec);border:1px solid var(--a-line);display:flex;align-items:center;justify-content:center;font-family:var(--f-brand);font-style:italic;font-size:22px;font-weight:700}
.toast{position:absolute;left:16px;right:16px;bottom:92px;background:#1a1a1a;color:#fff;border-radius:12px;padding:12px 14px;font-size:13px;z-index:30;display:flex;gap:10px;align-items:center;animation:tin .25s ease}
.toast b{color:var(--a-acc);font-family:var(--f-brand);font-style:italic}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
.sw{width:44px;height:24px;border-radius:99px;background:var(--a-line);border:0;position:relative;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:99px;background:#fff;transition:left .15s}
.sw[aria-checked="true"]{background:var(--a-pri)}
.sw[aria-checked="true"]::after{left:22px}
.tile{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border-radius:14px;border:0;width:100%;text-align:left}
.tile .sq{width:48px;height:48px;border-radius:10px;background:var(--a-sec);display:flex;align-items:center;justify-content:center;flex:none}
.sect{font-size:14px;font-weight:600;margin:0}
.av{border-radius:99px;background:#e3e3e3;display:flex;align-items:center;justify-content:center;font-weight:600;flex:none}
.input{height:40px;border-radius:10px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 12px;color:var(--a-mut);font-size:14px}
.onb{padding:16px 16px 24px;display:flex;flex-direction:column;flex:1;gap:20px}
.onb h1{margin:0;font-family:var(--f-brand);font-size:20px;text-transform:uppercase;font-style:italic;font-weight:400;line-height:1.25}
.onb .top{display:flex;align-items:center;justify-content:space-between;min-height:36px}
.onb .top button{border:0;background:transparent;width:36px;height:36px;margin-left:-8px;display:flex;align-items:center;justify-content:center}
.bottom{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.proto{border:1px dashed #b5b5b5;background:transparent;border-radius:10px;height:34px;font-size:12px;color:var(--a-mut);width:100%}
</style>

<div class="wrap">
  <aside class="side" aria-label="Pilotage du prototype">
    <div>
      <p class="brand">One More · flow complet<small>Parcours post-inscription, accueil, séance et onglets. Tape dans le téléphone comme dans l'app, et change les cas ici.</small></p>
    </div>
    <div class="box">
      <h2>Cas à tester</h2>
      <div class="ctl"><span>Utilisateur</span><div class="seg" data-key="profil"><button data-v="nouveau">Nouvel inscrit</button><button data-v="habitue">Habitué</button></div></div>
      <div class="ctl"><span>Rappel choisi</span><div class="seg" data-key="rappel"><button data-v="jours">Jours</button><button data-v="salle">Salle</button><button data-v="aucun">Aucun</button></div></div>
      <div class="ctl"><span>Séance</span><div class="seg" data-key="seance"><button data-v="non">Pas en cours</button><button data-v="oui">En cours</button></div></div>
      <div class="ctl"><span>Chrono en cours de séance</span><div class="seg" data-key="rest"><button data-v="non">Séance</button><button data-v="oui">Repos</button></div></div>
      <div class="ctl"><span>Série de flammes</span><div class="seg" data-key="serie"><button data-v="on">En cours</button><button data-v="risk">Dernier jour</button><button data-v="off">Perdue</button></div></div>
    </div>
    <div class="box">
      <h2>Scénarios rapides</h2>
      <div class="scen" id="scen"></div>
    </div>
    <div class="box">
      <h2>Écrans</h2>
      <div class="legend"><span class="tag t-new">Nouveau</span><span class="tag t-rev">Revu</span><span class="tag t-old">Existant</span><span>dans le code actuel</span></div>
      <div class="map" id="map"></div>
      <button class="reset" id="reset">Recommencer depuis l'inscription</button>
    </div>
  </aside>
  <div class="stagewrap">
    <div class="now" id="now" aria-live="polite"></div>
    <div class="stage" id="stage"><div class="phone" id="phone"><div class="screen"><div class="app" id="app"></div></div></div></div>
  </div>
</div>

 const today=n=>`<span class="c28" style="border:1px solid rgba(31,31,31,.4);box-shadow:0 0 0 1px rgba(31,31,31,.2)">${n}</span>`;
 const fut=n=>`<span class="c28" style="border:1px dashed #e3e3e3;color:#b5b5b5">${n}</span>`;
 const live=`<span class="c28" style="border:1.5px dashed ${OR}">${flame(14,OR)}</span>`;
 const done=`<span class="c28" style="background:#DFFF5E">${ic('check',12,'stroke-width:2.5')}</span>`;
 let c;
 if(nouveau()) c=[fut(5),fut(6),fut(7),enSeance()?live:today(8),fut(9),fut(10),fut(11)];
 else if(enSeance()) c=[fl(),fl(),rest(7),live,fut(9),fut(10),fut(11)];
 else if(S.serie==='on') c=[fl(),fl(),rest(7),today(8),fut(9),fut(10),fut(11)];
 else if(S.serie==='risk') c=[fl(),rest(6),rest(7),live,fut(9),fut(10),fut(11)];
 else c=[done,rest(6),rest(7),today(8),fut(9),fut(10),fut(11)];
 const sel=homeDay();return `<div class="week" role="tablist" aria-label="Séances de la semaine">${D.map((d,i)=>`<button data-act="wday" data-i="${i}" role="tab" aria-selected="${i===sel}" class="wd" style="border:0;background:none;padding:0 0 4px;cursor:pointer;position:relative"><small class="${i===3?'today':''}" style="${i===sel?'color:#1a1a1a;font-weight:700':''}">${i===3?'Auj.':d}</small>${c[i]}<span style="position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:16px;height:3px;border-radius:9px;background:${i===sel?'#1a1a1a':'transparent'}"></span></button>`).join('')}</div>`;
}
function progress(){
 let lvl,xp,pct,right,note='';
 if(nouveau()){lvl=1;xp=enSeance()?'40 / 100 XP':'0 / 100 XP';pct=enSeance()?40:0;
  right=enSeance()?`<span class="row" style="gap:8px"><span class="row" style="gap:4px;color:${OR}">${flame(16,OR,OR)}<span class="om" style="font-size:16px">1</span></span></span>`:`<span class="row" style="gap:4px;color:#b5b5b5">${flame(16,'#b5b5b5')}<span class="om" style="font-size:16px">0</span></span>`;}
 else{lvl=12;xp=enSeance()?'370 / 500 XP':'340 / 500 XP';pct=enSeance()?74:68;
  const st=enSeance()?'on':S.serie, n=enSeance()?6:5;
  if(st==='on'){right=`<span class="row" style="gap:8px"><span class="row" style="gap:4px;color:${OR}">${flame(16,OR,OR)}<span class="om" style="font-size:16px">${n}</span></span><span class="xp">+10% XP</span></span>`; if(!enSeance()) note=`<p class="row mut" style="margin:10px 0 0;gap:6px;font-size:12px">${ic('clock',16)}Série gardée jusqu'à vendredi minuit</p>`;}
  else if(st==='risk'){right=`<span class="row" style="gap:8px"><span class="row" style="gap:4px;color:${OR}">${flame(16,OR)}<span class="om" style="font-size:16px">5</span></span><span class="xp dash">+10% XP</span></span>`; note=`<p class="row" style="margin:10px 0 0;gap:8px;padding:8px 10px;border-radius:10px;background:#FFF4EC;color:${OR};font-weight:600;font-size:12px">${ic('clock',16)}<span style="flex:1">Tu perds ta série et ton bonus ce soir à minuit</span><span class="om" style="font-size:14px">5 h 42</span></p>`;}
  else right=`<span class="row" style="gap:4px;color:#b5b5b5">${flame(16,'#b5b5b5')}<span class="om" style="font-size:16px">0</span></span>`;}
 return `<section class="card" style="padding:12px 16px" aria-label="Ma progression"><div class="between" style="margin-bottom:8px"><span class="ct mut" style="display:inline-flex;align-items:baseline;gap:4px">Niveau <span class="om" style="font-size:16px;color:#1a1a1a">${lvl}</span></span>${right}</div><div class="bar"><div style="width:${pct}%"></div></div><p class="mut" style="margin:6px 0 0;font-size:12px">${xp}</p>${weekRow()}${note}</section>`;
}
function exoRow(e,i){return `<div class="exo"><button class="thumb" data-act="exo" data-i="${i}" aria-label="Voir ${e.n}" style="border:0">${ic('dumb',22)}</button><button data-act="exo" data-i="${i}" style="flex:1;min-width:0;border:0;background:none;text-align:left;display:flex;flex-direction:column;gap:8px;padding:0"><span class="ct">${e.n}</span><span class="row" style="gap:6px;flex-wrap:wrap"><span class="chip">${e.s||0} série${(e.s||0)>1?'s':''}</span>${e.r||''}</span></button><button class="plus" data-act="addperf" data-i="${i}" aria-label="Nouvelle performance">${ic('plus')}</button></div>`;}

function blockSeance(){
 const exos=S.exos; const series=exos.reduce((a,e)=>a+(e.s||0),0);
 const dur=nouveau()?(series>1?6:2):42; const recs=nouveau()?0:1;
 const LAST={'Développé couché':'80 kg × 4','Dips lestés':'20 kg × 8','Curl biceps':'16 kg × 10'};
 const stat=(v,l)=>`<span style="display:flex;flex-direction:column;gap:2px"><b class="om" style="font-size:18px;font-weight:700;line-height:1">${v}</b><span class="mut" style="font-size:11px">${l}</span></span>`;
 const row=(e,i)=>{const l=LAST[e.n]||(e.s?`${S.w} kg × ${S.r}`:'');return `<div class="exo"><button class="thumb" data-act="exo" data-i="${i}" aria-label="Voir ${e.n}" style="border:0">${ic('dumb',22)}</button><button data-go="seance" style="flex:1;min-width:0;border:0;background:none;text-align:left;display:flex;flex-direction:column;gap:6px;padding:0"><span class="ct">${e.n}</span><span class="row" style="gap:6px;flex-wrap:wrap"><span class="chip">${e.s||0} série${(e.s||0)>1?'s':''}</span>${l?`<span class="mut" style="font-size:12px">dernière : ${l}</span>`:''}</span></button><button class="plus" data-act="addperf" data-i="${i}" aria-label="Ajouter une série">${ic('plus')}</button></div>`;};
 return `<section class="card" style="overflow:hidden;display:flex;flex-direction:column" aria-label="Séance en cours">
  <div class="lime" style="padding:14px 16px"><div class="between"><h2 class="ct row" style="gap:8px"><span class="pdot" aria-hidden="true"></span>Séance en cours</h2><button data-go="seance" class="row" style="gap:2px;border:0;background:none;padding:0;font-size:13px;font-weight:600;color:#000">Voir la séance ${ic('chev',16)}</button></div></div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:14px 16px;border-bottom:1px solid #e3e3e3">${stat(exos.length,'exercices')}${stat(series,'séries')}${stat(recs,'record'+(recs>1?'s':''))}${stat(dur+"'",'durée')}</div>
  <div style="padding:4px 16px 16px;display:flex;flex-direction:column">${exos.map(row).join('')}
  <button class="btn b-dark" style="margin-top:4px" data-act="pick">${ic('plus',16)}Ajouter un exercice</button></div></section>`;
}
function blockPremiere(){
 const tagOn=`<span class="row" style="gap:6px;height:24px;padding:0 10px;border-radius:99px;background:#DFFF5E;color:#000;font-size:11px;font-weight:600">${ic('bell',12)}Rappel activé</span>`;
 const tagOff=`<span class="row" style="gap:6px;height:24px;padding:0 10px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:600">${ic('bell',12)}Pas de rappel</span>`;
 const link=(t,a)=>`<button data-act="${a}" class="btn" style="height:40px;background:rgba(255,255,255,.12);border:0;color:#fff;font-family:var(--f-ui);text-transform:none;letter-spacing:0;font-size:14px;font-weight:600">${ic('bell',16)}${t}</button>`;
 let tag,title,sub,btns;
 if(S.rappel==='jours'){tag=tagOn;title='On te notifie<br><span style="color:#DFFF5E">vendredi à 18:30</span>';sub="Pas besoin d'attendre : 1 exercice et 1 série suffisent pour lancer ta série.";btns=link('Modifier mon rappel','rappel');}
 else if(S.rappel==='salle'){tag=tagOn;title='On te notifie<br><span style="color:#DFFF5E">en arrivant à la salle</span>';sub=GYMS[S.gymSel][0]+'. Déjà sur place ? Lance-toi, 1 exercice suffit.';btns=link('Modifier mon rappel','rappel');}
 else{tag=tagOff;title='On te prévient<br><span style="color:#DFFF5E">quand ?</span>';sub='Choisis tes jours ou ta salle, on te rappelle au bon moment.';btns=`<button class="btn b-lime" data-act="rappel">${ic('bell',14)}Activer un rappel</button>`;}
 return `<section class="card" style="overflow:hidden;background:#0a0a0a;color:#fff;display:flex;flex-direction:column" aria-label="Ta première séance">
 <div style="position:relative;height:120px;background:url(${HERO}) center 35%/cover"><span style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,10,.15) 20%,#0a0a0a 100%)"></span>
  <div class="between" style="position:absolute;top:12px;left:12px;right:12px"><span class="ct" style="text-shadow:0 1px 4px rgba(0,0,0,.5)">Ta première séance</span>${tag}</div></div>
 <div style="padding:0 16px 16px;margin-top:-14px;position:relative;display:flex;flex-direction:column;gap:12px">
  <p class="om" style="margin:0;font-size:26px;line-height:1;text-transform:uppercase">${title}</p>
  <p style="margin:0;font-size:13px;line-height:1.45;color:#c9c9c9">${sub}</p>
  ${btns}</div></section>`;
}
function blockDerniere(){
 return `<section class="card" style="overflow:hidden" aria-label="Ta dernière séance"><div class="between" style="align-items:flex-start;padding:16px 16px 0"><div style="display:flex;flex-direction:column;gap:6px"><h2 class="ct">Ta dernière séance</h2><span class="mut" style="font-size:12px">4 exercices · 14 séries</span></div><span class="mut" style="font-size:11px;text-align:right">Mardi<br>9:05 · 1h12</span></div>
 <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px">${[['Volume','6 240','kg'],['Records','2',''],['XP','+340','']].map(([a,b,c])=>`<div style="background:#F7F7F7;border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:2px"><span class="mut" style="font-size:12px">${a}</span><span class="om" style="font-size:18px">${b} <small class="mut" style="font:400 12px var(--f-ui)">${c}</small></span></div>`).join('')}</div>
 
 <button data-act="seancePast" class="between" style="width:100%;margin-top:16px;padding:14px 16px;border:0;border-top:1px solid #e3e3e3;background:none;font-size:14px;font-weight:500">Voir le récap de séance ${ic('chev',16,'color:#757575')}</button></section>`;
}
function blockProchaine(){
 const st=S.serie; let t,tag,f,b;
 if(st==='on'){t='Prochaine séance';tag=`<span class="row" style="gap:4px;font-size:12px;font-weight:600">${flame(14,'#000')}Série de 5 jours</span>`;f=[['2 j','depuis la dernière'],['5','jours de série'],['+10%','bonus XP']];b='Démarrer une séance';}

 return `<section class="card lime" style="border-radius:14px" aria-label="Prochaine séance"><span class="skew"></span><div class="between"><h2 class="ct">${t}</h2>${tag}</div><div class="figs">${f.map(([a,c])=>`<span><b>${a}</b><span>${c}</span></span>`).join('')}</div><button class="btn b-black" data-act="pick">${ic('play',14,'fill:#DFFF5E')}${b}</button></section>`;
}

 return `<div class="drawer" role="dialog" aria-label="Régler le chrono de repos"><div class="grab"></div><p class="dt">Temps de repos</p>

DR.finish=()=>{const series=S.exos.reduce((a,e)=>a+(e.s||0),0);return `<div class="drawer" role="dialog" aria-label="Terminer la séance"><div class="grab"></div><p class="dt">Terminer la séance ?</p>
 <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${[[S.exos.length,'exercices'],[series,'séries'],[fmtT((Date.now()-T0)/1000),'durée']].map(([v,l])=>`<div style="background:#fff;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px"><b class="om" style="font-size:18px;font-weight:700">${v}</b><span class="mut" style="font-size:11px">${l}</span></div>`).join('')}</div>

const app=document.getElementById('app');
function render(){
 app.innerHTML=(R[S.screen]||R.home)()+(S.drawer?`<div class="drawer-wrap" data-act="closeDrawer">${DR[S.drawer]()}</div>`:'')+(S.toast?`<div class="toast" role="status">${S.toast}</div>`:'');
 const m=SCREENS[S.screen]; const d=S.drawer&&DRAWERS[S.drawer];
 const cur=d||m;
 document.getElementById('now').innerHTML=`<span class="tag t-${cur.tag}">${TAGTXT[cur.tag]}</span>${d?m.name+' › '+d.name:(S.screen==='home'?homeName():m.name)}`;
 document.querySelectorAll('.seg').forEach(sg=>{const k=sg.dataset.key;sg.querySelectorAll('button').forEach(b=>{b.setAttribute('aria-pressed',S[k]===b.dataset.v);if(k==='serie')b.disabled=nouveau()||enSeance();if(k==='rappel')b.disabled=!nouveau();if(k==='rest')b.disabled=!enSeance();});});
 document.querySelectorAll('#map [data-s]').forEach(b=>b.setAttribute('aria-current',b.dataset.s===S.screen));
}
function homeName(){if(enSeance())return 'Accueil · séance en cours';if(nouveau())return 'Accueil · nouvel inscrit · '+({jours:'rappel jours',salle:'rappel salle',aucun:'sans rappel'})[S.rappel];return 'Accueil · récap · série '+({on:'en cours',risk:'dernier jour',off:'perdue'})[S.serie];}

function addExo(c){S.exos.push({n:c.n,m:c.m,r:c.n==='Développé couché'&&!nouveau()?OR2:'',s:0});return S.exos.length-1;}
function startSeanceWith(i){S.drawerExo=S.exos[i];S.target=i;S.drawer='addperf';render();}

app.addEventListener('click',ev=>{
 const t=ev.target.closest('[data-go],[data-act],[data-tab],[data-drawer]'); if(!t||!app.contains(t)) return;
 if(t.dataset.act==='closeDrawer'&&ev.target!==t) return;
 if(t.dataset.tab){if(t.dataset.tab==='exercices'&&S.screen==='exercices')S.exZone=null;S.stack=[];S.screen=t.dataset.tab;S.drawer=null;render();return;}
 if(t.dataset.drawer){S.drawer=t.dataset.drawer;render();return;}
 if(t.dataset.go){if(t.dataset.past)S.pastView=1;go(t.dataset.go);return;}
 const a=t.dataset.act,i=+t.dataset.i;
 switch(a){
  case 'back':back();break;
  case 'pastDetail':S.pastDetail=true;S.detailOpenKey='p1';S.detailOpen=0;go('seance');break;
  case 'closeDrawer':S.drawer=null;render();break;
  case 'restAdj':S.restDraft=Math.max(15,Math.min(600,(S.restDraft??S.restDur)+ +t.dataset.d));render();break;
  case 'restPick':S.restDraft=+t.dataset.v;render();break;
  case 'restKeep':S.restKeep=S.restKeep===false;render();break;
  case 'restApply':S.restDur=S.restDraft??S.restDur;S.restDraft=null;S.drawer=null;render();toast('Repos réglé sur <b>'+fmtT(S.restDur)+'</b>');break;
  case 'restRestart':S.restDur=S.restDraft??S.restDur;S.restDraft=null;S.drawer=null;REST0=Date.now();render();break;
  case 'restPop':S.restPop=!S.restPop;render();break;
  case 'restPopClose':S.restPop=false;render();break;
  case 'restStep':S.restDur=Math.max(30,Math.min(300,S.restDur+ +t.dataset.d));render();break;
  case 'restPick2':S.restDur=+t.dataset.v;render();break;
  case 'restSkip':S.restPop=false;S.rest='non';render();break;
  case 'rest30':REST0+=30000;render();break;
  case 'finishGo':S.seance='non';S.rest='non';S.drawer=null;go('recap');toast('Séance terminée · <b>+340 XP</b>');break;
  case 'story':S.storyK=+t.dataset.k;S.drawer='story';render();break;
  case 'storyBg':S.storyBg=t.dataset.v;render();break;
  case 'storyShare':S.drawer=null;toast('Story prête · <b>Instagram</b>');break;
  case 'storySave':S.drawer=null;toast('Image enregistrée');break;
  case 'pick':S.stack=[];S.screen='exercices';S.drawer=null;render();{const sc=document.querySelector('#app .scroll');if(sc)sc.scrollTop=0;}break;
  case 'zf':S.zone=t.dataset.z;render();break;
  case 'zone2':S.exZone=t.dataset.z||null;render();{const sc=document.querySelector('#app .scroll');if(sc)sc.scrollTop=0;}break;
  case 'addperfN':{const n=t.dataset.n;S.fromCat=0;S.drawerExo=S.exos.find(e=>e.n===n)||HAB_EXOS.find(e=>e.n===n);S.drawer='addperf';render();break;}
  case 'exoN':{const n=t.dataset.n;const k=S.exos.findIndex(e=>e.n===n);S.target=k>=0?k:null;S.targetN=n;go('exo-detail');break;}
  case 'zone':S.picker='list';render();break;
  case 'addFromCat':{const idx=addExo(CATALOG[i]);S.fromCat=1;S.drawerExo=S.exos[idx];S.target=idx;S.drawer='addperf';render();break;}
  case 'addperf':S.fromCat=0;S.drawerExo=S.exos[i]||HAB_EXOS[i];S.target=i;S.drawer='addperf';render();break;
  case 'inc':S[t.dataset.k]=t.dataset.k==='w'?S.w+2.5:S.r+1;render();break;
  case 'dec':S[t.dataset.k]=Math.max(t.dataset.k==='w'?0:1,t.dataset.k==='w'?S.w-2.5:S.r-1);render();break;
  case 'savePerf':{let e=S.exos.includes(S.drawerExo)?S.drawerExo:null;if(!e){e={...S.drawerExo,s:0};S.exos.push(e);}if(e)e.s=(e.s||0)+1;const first=!enSeance();S.seance='oui';S.drawer=null;S.rest='oui';REST0=Date.now();
    if(S.screen==='picker'){S.stack=[];S.screen='home';}
    toast(`${ic('check',16,'color:#DFFF5E')}<span style="flex:1">${first?'Séance lancée, ta série démarre':'Série enregistrée'}</span><b>+40 XP</b>`);break;}
  case 'exo':S.target=i;S.targetN=(S.exos[i]||{}).n;go('exo-detail');break;
  case 'sesHome':S.stack=[];S.screen='home';S.homeDay=3;S.drawer=null;render();{const sc=document.querySelector('#app .scroll');if(sc)sc.scrollTop=0;}break;
  case 'wday':S.homeDay=i;S.detailOpen=0;S.detailOpenKey=null;render();break;
  case 'toggleExo2':{const k=t.dataset.k;if(S.detailOpenKey===k&&S.detailOpen===i){S.detailOpen=-1;}else{S.detailOpenKey=k;S.detailOpen=i;}render();break;}
  case 'toggleExo':S.detailOpen=S.detailOpen===i?-1:i;render();break;
  case 'seancePast':go('recap');break;
  case 'rappel':go('onb-rappel');break;
  case 'selJours':if(ev.target.closest('[data-act="day"]'))break;S.rappel='jours';render();break;
  case 'day':S.dayRemind[t.dataset.d]=S.dayRemind[t.dataset.d]?0:1;render();break;
  case 'selSalle':go('gym-search');break;
  case 'validJours':S.rappel='jours';go('onb-attente');break;
  case 'skipRappel':S.rappel='aucun';S.stack=[];S.screen='home';render();break;
  case 'pickGym':S.gymSel=i;S.rappel='salle';go('gym-perms');break;
  case 'noGym':S.rappel='aucun';toast('Tu pourras renseigner ta salle dans Réglages.');S.stack=[];S.screen='home';render();break;
  case 'perm':S.perm[t.dataset.k]=!S.perm[t.dataset.k];render();break;
  case 'toHome':S.stack=[];S.screen='home';render();break;
 }
});
